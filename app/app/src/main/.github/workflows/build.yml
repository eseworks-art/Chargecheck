name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move MainActivity.kt to proper Android folder
        run: |
          mkdir -p app/src/main/java/com/example/chargingmonitor
          if [ -f "MainActivity.kt" ]; then
            cp MainActivity.kt app/src/main/java/com/example/chargingmonitor/MainActivity.kt
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Charging-Monitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
